<!DOCTYPE html>
<html>
<head>
    <title>Simulated Slow Client</title>
</head>
<body>

    <h1>Simulated Slow Client</h1>

    <script>
        window.addEventListener('load', () => {
            console.time('loadEventDuration');

            const startTime = performance.now(); // More accurate timing

            // Simulate slow processing using setTimeout (or other async methods)
            function simulateSlowProcessing(duration) {
                const endTime = startTime + duration; // Calculate end time
                while (performance.now() < endTime) {
                    // Waste CPU cycles (but not blocking the event loop entirely)
                    // You could do a small calculation here to avoid optimization
                    Math.sqrt(Math.random()); 
                }
            }

            // Example 1: Simulate initial setup/processing (e.g., 2 seconds)
            console.log("Starting initial setup...");
            simulateSlowProcessing(2000); // 2000 milliseconds = 2 seconds
            console.log("Initial setup complete.");


            // Example 2: Simulate another task (e.g., 3 seconds)
            console.log("Starting another task...");
            simulateSlowProcessing(3000);
            console.log("Another task complete.");

            // Example 3: Simulate one more task (e.g. 1 second)
            console.log("Starting final task...");
            simulateSlowProcessing(1000);
            console.log("Final task complete.");

            console.timeEnd('loadEventDuration');
        });
    </script>

</body>
</html>
