<!DOCTYPE html>
<html>
<head>
    <title>Very Slow Render</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0; /* Remove default margins */
        }
        #container {
            width: 800px; /* Or whatever size you want */
            height: 600px; /* Or whatever size you want */
            position: relative; /* For absolute positioning of items */
            border: 1px solid #ccc;
        }
        .item {
            position: absolute; /* Position items within the container */
            width: 50px; /* Adjust size as needed */
            height: 50px; /* Adjust size as needed */
            background-color: lightblue;
            /* Add more styling as desired */
        }
    </style>
</head>
<body>

    <h1>Very Slow Render</h1>

    <div id="container"></div>

    <script>
        const container = document.getElementById('container');
        const numItems = 200; // Number of graphical elements (adjust)
        const containerWidth = container.offsetWidth;
        const containerHeight = container.offsetHeight;

        console.time('renderTime');

        // Use requestAnimationFrame for smoother animations
        function animate() {
            for (let i = 0; i < numItems; i++) {
                const item = document.createElement('div');
                item.className = 'item';

                // Random positioning
                const x = Math.random() * (containerWidth - 50);  // Subtract item width
                const y = Math.random() * (containerHeight - 50); // Subtract item height

                item.style.left = `${x}px`;
                item.style.top = `${y}px`;

                // Add some graphical complexity - example: gradient backgrounds
                item.style.background = `linear-gradient(to bottom right, hsl(${Math.random()*360}, 100%, 50%), hsl(${Math.random()*360}, 100%, 50%))`;

                container.appendChild(item);
            }
            console.timeEnd('renderTime');
        }

       // Introduce a deliberate delay before starting animation (adjust as needed)
        setTimeout(animate, 2000); // 2-second delay


    </script>

</body>
</html>
