<!DOCTYPE html>
<html>
<head>
    <title>Slow Client Processing</title>
    <style>
        body {
            font-family: sans-serif;
        }
        #container {
            /* If you need specific styling for the container */
        }
    </style>
</head>
<body>

    <h1>Slow Client Processing</h1>

    <div id="container"></div>

    <script>
        window.addEventListener('load', () => {
            console.time('loadEventDuration');

            // 1. Simulate DOM Manipulation (Graphical Elements - Optional but Realistic)
            const container = document.getElementById('container');
            const numItems = 500; // Adjust for desired load time
            if (container) { // Check if the container exists
                for (let i = 0; i < numItems; i++) {
                    const item = document.createElement('div');
                    item.textContent = `Item ${i + 1}`; // Or add images, etc.
                    container.appendChild(item);
                }
            }

            // 2. Simulate CPU-Bound Work (Complex Calculations)
            let sum = 0;
            const calculationIterations = 5000000; // Adjust for load
            for (let i = 0; i < calculationIterations; i++) {
                sum += Math.sqrt(i); // Or any other complex calculation
            }
            console.log("Calculation complete:", sum);


            // 3. Simulate Asynchronous Work (Optional but Realistic)
            // You can add timeouts, fetch calls, or other async operations here.
            // Example using setTimeout:
            // setTimeout(() => {
            //     console.log("Asynchronous task completed.");
            //     // Add additional processing here if needed.
            // }, 2000); // 2-second delay


            console.timeEnd('loadEventDuration');
        });
    </script>

</body>
</html>
