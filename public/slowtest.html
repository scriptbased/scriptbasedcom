<!DOCTYPE html>
<html>
<head>
    <title>Simulated Slow Client with Animation</title>
    <style>
        #loading-overlay {
            position: fixed; /* Cover the entire viewport */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent backdrop */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            z-index: 9999; /* Ensure it's on top */
        }

      .loader { /* Styles for the loading circle */
            border: 16px solid #f3f3f3; /* Light grey */
            border-top: 16px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite; /* Animate the circle */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #container { /* Style the main content area (if needed) */
            /*... your styles... */
        }
    </style>
</head>
<body>

    <h1>Simulated Slow Client</h1>

    <div id="loading-overlay">  <div class="loader"></div>
    </div>

    <div id="container"></div>  <script>
        window.addEventListener('load', () => {
            const loadingOverlay = document.getElementById('loading-overlay');
            console.time('loadEventDuration');

            const startTime = performance.now();

            function simulateSlowProcessing(duration) {
                const endTime = startTime + duration;
                while (performance.now() < endTime) {
                    Math.sqrt(Math.random());
                }
            }

            //... (Your simulateSlowProcessing calls as before)...
            simulateSlowProcessing(2000);
            simulateSlowProcessing(3000);
            simulateSlowProcessing(1000);

            console.timeEnd('loadEventDuration');

            // Hide the loading overlay when done
            loadingOverlay.style.display = 'none';
        });
    </script>

</body>
</html>
